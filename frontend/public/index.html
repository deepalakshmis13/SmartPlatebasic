<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="SmartPlate - Reducing Hunger Through Food Redistribution" />
        <title>SmartPlate - Food Redistribution Platform</title>
        
        <!-- Leaflet CSS (ONCE ONLY) -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        
        <!-- SmartPlate Map Styles -->
        <style>
            #smartplate-map { 
                height: 500px; width: 100%; 
                border-radius: 12px; 
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                border: 2px solid #e1f5fe;
                margin: 20px auto;
                max-width: 1200px;
            }
            .smartplate-btn { 
                background: linear-gradient(135deg, #28a745, #20c997);
                color: white; border: none; 
                padding: 12px 24px; border-radius: 25px; 
                cursor: pointer; font-size: 16px; font-weight: 600;
                box-shadow: 0 4px 15px rgba(40,167,69,0.3);
                transition: all 0.3s ease;
            }
            .smartplate-btn:hover { 
                transform: translateY(-2px); 
                box-shadow: 0 6px 20px rgba(40,167,69,0.4);
                background: linear-gradient(135deg, #218838, #1ea085);
            }
            .smartplate-matches {
                background: white; border-radius: 12px; 
                padding: 20px; margin: 20px auto;
                box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                max-width: 1200px; max-height: 300px; overflow-y: auto;
            }
            .leaflet-popup-tip { background: #28a745 !important; }
        </style>
    </head>
    
    <!-- ✅ NO LINK TAGS HERE - MOVED TO HEAD -->
    
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>  <!-- ✅ React will render HERE -->

        <!-- Leaflet JS + SmartPlate Logic -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            // Global SmartPlate Map Functions (for React dashboards)
            window.smartplateMapReady = false;
            
            // Initialize map utils
            window.smartplateLocations = [
                {name: '🍚 Donor: Rice 5kg', lat: 13.05, lng: 80.25, type: 'donor'},
                {name: '🥛 Donor: Milk 10L', lat: 13.08, lng: 80.28, type: 'donor'},
                {name: '🥗 NGO Shelter A', lat: 13.07, lng: 80.26, type: 'ngo'},
                {name: '🍞 NGO Soup Kitchen', lat: 13.09, lng: 80.24, type: 'ngo'},
                {name: '🍲 Donor: Veg Curry 3kg', lat: 13.06, lng: 80.27, type: 'donor'},
            ];

            window.getDistance = (lat1, lng1, lat2, lng2) => {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * 
                         Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2)**2;
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            };

            window.findNearestMatches = (userLat, userLng, mapId = 'smartplate-map') => {
                const map = window.L.map(mapId);
                window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                map.setView([13.0827, 80.2707], 11);
                
                const matches = window.smartplateLocations
                    .map(loc => {
                        const dist = window.getDistance(userLat, userLng, loc.lat, loc.lng);
                        return dist < 20 ? { ...loc, dist: dist.toFixed(1) } : null;
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.dist - b.dist);

                matches.forEach(match => {
                    const color = match.type === 'donor' ? '#28a745' : '#ffc107';
                    window.L.circleMarker([match.lat, match.lng], {
                        radius: 10, fillColor: color, color: '#000', weight: 2, fillOpacity: 0.8
                    }).addTo(map).bindPopup(`<b>${match.name}</b><br>📏 ${match.dist}km`);
                });
                
                window.smartplateMapReady = true;
                return matches;
            };

            window.claimFood = (foodName) => {
                alert(`✅ Claimed: ${foodName}`);
                if (window.posthog) window.posthog.capture('food_claimed', { food: foodName });
            };
        </script>

</html>
