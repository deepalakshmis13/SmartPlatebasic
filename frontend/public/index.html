<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />

        <!-- Updated meta description -->
        <meta
            name="description"
            content="SmartPlate - Reducing Hunger Through Food Redistribution"
        />

        <!-- Updated title -->
        <title>SmartPlate - Food Redistribution Platform</title>
        
        <!-- ✅ Leaflet CSS ADDED -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        
        <!-- ✅ SmartPlate Map Custom Styles ADDED -->
        <style>
            /* Map container */
            #smartplate-map { 
                height: 500px; 
                width: 100%; 
                max-width: 1200px;
                margin: 20px auto;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                border: 2px solid #e1f5fe;
            }
            
            /* Map buttons */
            .smartplate-map-btn { 
                background: linear-gradient(135deg, #28a745, #20c997);
                color: white; 
                border: none; 
                padding: 12px 24px; 
                border-radius: 25px; 
                font-size: 16px; 
                font-weight: 600;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(40,167,69,0.3);
                transition: all 0.3s ease;
                margin: 10px 0;
            }
            .smartplate-map-btn:hover { 
                transform: translateY(-2px); 
                box-shadow: 0 6px 20px rgba(40,167,69,0.4);
                background: linear-gradient(135deg, #218838, #1ea085);
            }
            
            /* Matches list */
            .smartplate-matches {
                background: white; 
                border-radius: 12px; 
                padding: 20px; 
                margin: 20px auto;
                box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                max-width: 1200px; 
                max-height: 300px; 
                overflow-y: auto;
            }
            
            /* Custom popup styling */
            .leaflet-popup-content-wrapper {
                border-radius: 12px !important;
            }
            .leaflet-popup-tip {
                background: #28a745 !important;
            }
        </style>
    </head>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        
        <!-- ✅ SmartPlate Global Map Functions ADDED -->
        <script>
            // Global variables for React dashboards
            window.smartplateMapReady = false;
            window.smartplateMap = null;
            
            // Sample SmartPlate data (replace with your API)
            window.smartplateLocations = [
                {name: '🍚 Donor: Rice 5kg (Anna Nagar)', lat: 13.083, lng: 80.261, type: 'donor'},
                {name: '🥛 Donor: Milk 10L (T.Nagar)', lat: 13.042, lng: 80.261, type: 'donor'},
                {name: '🥗 NGO Shelter A (Egmore)', lat: 13.080, lng: 80.263, type: 'ngo'},
                {name: '🍞 NGO Soup Kitchen (Mylapore)', lat: 13.047, lng: 80.271, type: 'ngo'},
                {name: '🍲 Donor: Veg Curry 3kg (Adyar)', lat: 13.004, lng: 80.257, type: 'donor'},
                {name: '🍎 Donor: Fruits 8kg (Velachery)', lat: 12.976, lng: 80.220, type: 'donor'},
            ];

            // Haversine distance formula (km)
            window.getDistance = function(lat1, lng1, lat2, lng2) {
                const R = 6371; // Earth radius in km
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat/2)**2 + 
                         Math.cos(lat1 * Math.PI/180) * 
                         Math.cos(lat2 * Math.PI/180) * 
                         Math.sin(dLng/2)**2;
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            };

            // Initialize map on any div
            window.initSmartplateMap = function(mapId = 'smartplate-map') {
                const mapDiv = document.getElementById(mapId);
                if (mapDiv && window.L && !window.smartplateMap) {
                    window.smartplateMap = window.L.map(mapId).setView([13.0827, 80.2707], 11);
                    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors | SmartPlate Hackathon'
                    }).addTo(window.smartplateMap);
                    
                    // Add faint initial markers
                    window.smartplateLocations.forEach(loc => {
                        window.L.circleMarker([loc.lat, loc.lng], {
                            radius: 4,
                            fillColor: loc.type === 'donor' ? '#90EE90' : '#FFD700',
                            color: '#666',
                            weight: 1,
                            fillOpacity: 0.4
                        }).addTo(window.smartplateMap).bindPopup(loc.name);
                    });
                    
                    window.smartplateMapReady = true;
                    console.log('✅ SmartPlate Map initialized');
                }
            };

            // Main matching function for React dashboards
            window.findNearestMatches = function(userLat, userLng, mapId = 'smartplate-map') {
                if (!window.smartplateMapReady) {
                    window.initSmartplateMap(mapId);
                }
                
                const map = window.smartplateMap;
                if (!map) return [];

                // Clear previous match markers
                map.eachLayer(layer => {
                    if (layer instanceof window.L.CircleMarker && layer.options.radius > 5) {
                        map.removeLayer(layer);
                    }
                });

                // Find matches within 20km
                const matches = window.smartplateLocations
                    .map(loc => {
                        const dist = window.getDistance(userLat, userLng, loc.lat, loc.lng);
                        return dist < 20 ? { ...loc, dist: dist.toFixed(1) } : null;
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.dist - b.dist)
                    .slice(0, 6);

                // Add highlighted markers
                matches.forEach(match => {
                    const color = match.type === 'donor' ? '#28a745' : '#ffc107';
                    window.L.circleMarker([match.lat, match.lng], {
                        radius: 10,
                        fillColor: color,
                        color: '#000',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    })
                    .addTo(map)
                    .bindPopup(`
                        <div style="text-align: center; min-width: 200px;">
                            <b style="color: #28a745;">${match.name}</b><br>
                            📏 <strong>${match.dist}km</strong> away<br><br>
                            <button onclick="window.claimFood('${match.name}')" 
                                    style="width:100%; padding:8px; background:#28a745; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">
                                ✅ Claim Food Now
                            </button>
                        </div>
                    `);
                });

                // Auto-fit map to matches
                if (matches.length > 0) {
                    const group = new window.L.featureGroup(
                        matches.map(m => window.L.circleMarker([m.lat, m.lng]))
                    );
                    map.fitBounds(group.getBounds().pad(0.2));
                }

                return matches;
            };

            // Claim food handler
            window.claimFood = function(foodName) {
                alert(`✅ SUCCESS!\n\nClaimed: ${foodName}\n\nFood match confirmed! Check your dashboard for pickup details.`);
                if (window.posthog) {
                    window.posthog.capture('food_claimed', { 
                        food: foodName,
                        timestamp: new Date().toISOString()
                    });
                }
            };

            // Auto-init map if smartplate-map div exists
            document.addEventListener('DOMContentLoaded', function() {
                const mapDiv = document.getElementById('smartplate-map');
                if (mapDiv) {
                    setTimeout(() => window.initSmartplateMap(), 100);
                }
            });
        </script>
